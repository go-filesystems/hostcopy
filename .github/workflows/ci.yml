name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, arch: amd64 }
          - { os: ubuntu-24.04-arm, arch: arm64 }
          - { os: macos-latest, arch: arm64 }
          - { os: windows-latest, arch: amd64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.1' }
      - run: go vet ./...
      - run: go test -race -v ./...
      # On Linux only: the kernel copy, and what follows it in Range, runs
      # nowhere else, so 100% elsewhere would mean testing what cannot run.
      - name: coverage gate (100%, Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          go test -covermode=atomic -coverprofile=cov.out ./...
          go tool cover -func=cov.out | tail -n 20
          if go tool cover -func=cov.out | grep -vE '100\.0%' | grep -v '^total:'; then
            echo "coverage below 100%"; exit 1
          fi
  emulated:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: riscv64, image: "debian:trixie", qemu: "rv64,v=true,vlen=128" }
          - { arch: loong64, image: "ghcr.io/loong64/debian:trixie", qemu: "la464" }
          - { arch: ppc64le, image: "debian:trixie", qemu: "power9" }
          - { arch: s390x,   image: "debian:trixie", qemu: "qemu" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.1' }
      - run: docker run --privileged --rm tonistiigi/binfmt --install all
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} go test -c -o /tmp/t.test .
      - run: docker run --rm --platform linux/${{ matrix.arch }} -e QEMU_CPU=${{ matrix.qemu }} -v /tmp:/t ${{ matrix.image }} /t/t.test -test.v -test.short -test.timeout 20m
  cross:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ["freebsd/amd64", "openbsd/amd64", "netbsd/amd64", "plan9/amd64", "js/wasm", "wasip1/wasm", "linux/386", "linux/arm"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.1' }
      - run: |
          export GOOS=${TARGET%/*} GOARCH=${TARGET#*/}
          go vet ./...
        env: { TARGET: "${{ matrix.target }}" }
